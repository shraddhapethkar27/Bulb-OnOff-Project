<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb On/Off Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1> Bulb On/Off Project</h1>

        <img id="bulb" src="bulboff.gif" alt="Bulb Image">

        <div class="buttons">
            <button class="off-btn" onclick="bulbOff()">Bulb Off</button>
            <button class="on-btn" onclick="bulbOn()">Bulb On</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
